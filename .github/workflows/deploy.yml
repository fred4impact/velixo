# Builds images, pushes to ECR, and updates the Helm values file for the
# target environment — classic GitOps: CI only ever writes to git, ArgoCD
# does the actual deploying by reconciling from what CI committed.
#
# stage deploys automatically on every push to main. prod is a deliberate,
# separate, manually-triggered promotion of an already-built backend image
# and a freshly-built (prod-flavored) frontend image — never an automatic
# consequence of a stage deploy.
#
# Required repo configuration:
#   secrets.AWS_ROLE_ARN                       — OIDC role CI assumes (no static AWS keys)
#   secrets.STRIPE_PUBLISHABLE_KEY_STAGE/_PROD — Stripe publishable keys per env
#   vars.AWS_ACCOUNT_ID, vars.AWS_REGION

name: Deploy

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "deployment/helm/**"
  workflow_dispatch:
    inputs:
      promote_sha:
        description: "Backend image tag (git sha) already validated in stage, to promote to prod"
        required: true

permissions:
  id-token: write # OIDC -> AWS
  contents: write # commit updated values-*.yaml back to the repo

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REGISTRY: ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com

jobs:
  deploy-stage:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr

      - name: Build & push backend (one image, promoted unchanged to prod later)
        run: |
          docker build --target prod -t "$ECR_REGISTRY/ecommerce-backend:${{ github.sha }}" ./backend
          docker push "$ECR_REGISTRY/ecommerce-backend:${{ github.sha }}"

      - name: Build & push frontend (stage-flavored — see strategy.md)
        run: |
          docker build --target prod \
            --build-arg NEXT_PUBLIC_API_URL=https://api.ecommerce-stage.example.com \
            --build-arg NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${{ secrets.STRIPE_PUBLISHABLE_KEY_STAGE }} \
            -t "$ECR_REGISTRY/ecommerce-frontend:${{ github.sha }}-stage" ./frontend
          docker push "$ECR_REGISTRY/ecommerce-frontend:${{ github.sha }}-stage"

      - name: Update deployment/helm/ecommerce/values-stage.yaml
        run: |
          go install github.com/mikefarah/yq/v4@latest
          export PATH="$HOME/go/bin:$PATH"
          yq -i '.backend.image.tag = "${{ github.sha }}"' deployment/helm/ecommerce/values-stage.yaml
          yq -i '.frontend.image.tag = "${{ github.sha }}-stage"' deployment/helm/ecommerce/values-stage.yaml

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add deployment/helm/ecommerce/values-stage.yaml
          git commit -m "deploy(stage): ${{ github.sha }}" || echo "nothing to commit"
          git push

  promote-prod:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production # requires a manual approval gate configured on this GitHub Environment
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2

      - name: Verify the backend image already exists (built during a stage deploy)
        run: docker manifest inspect "$ECR_REGISTRY/ecommerce-backend:${{ github.event.inputs.promote_sha }}"

      - name: Build & push frontend (prod-flavored)
        run: |
          docker build --target prod \
            --build-arg NEXT_PUBLIC_API_URL=https://api.ecommerce.example.com \
            --build-arg NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${{ secrets.STRIPE_PUBLISHABLE_KEY_PROD }} \
            -t "$ECR_REGISTRY/ecommerce-frontend:${{ github.event.inputs.promote_sha }}-prod" ./frontend
          docker push "$ECR_REGISTRY/ecommerce-frontend:${{ github.event.inputs.promote_sha }}-prod"

      - name: Update deployment/helm/ecommerce/values-prod.yaml
        run: |
          go install github.com/mikefarah/yq/v4@latest
          export PATH="$HOME/go/bin:$PATH"
          yq -i '.backend.image.tag = "${{ github.event.inputs.promote_sha }}"' deployment/helm/ecommerce/values-prod.yaml
          yq -i '.frontend.image.tag = "${{ github.event.inputs.promote_sha }}-prod"' deployment/helm/ecommerce/values-prod.yaml

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add deployment/helm/ecommerce/values-prod.yaml
          git commit -m "deploy(prod): ${{ github.event.inputs.promote_sha }}"
          git push
