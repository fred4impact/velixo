apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: ecommerce
data:
  PORT: "4000"
  NODE_ENV: production
  JWT_ACCESS_EXPIRES_IN: 15m
  JWT_REFRESH_EXPIRES_IN: 7d
  BCRYPT_SALT_ROUNDS: "10"
  FLAT_TAX_RATE: "0.08"
  FLAT_SHIPPING_RATE: "5.00"
  MINIO_BUCKET: product-images
  MINIO_USE_SSL: "false"
