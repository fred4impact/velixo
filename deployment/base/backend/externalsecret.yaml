# Syncs one JSON secret from AWS Secrets Manager into a K8s Secret named
# "backend-secret", whose keys become env vars via envFrom in rollout.yaml.
# The remote key (spec.dataFrom[0].extract.key) is patched per overlay.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: backend-secret
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: ecommerce
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: backend-secret
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: ecommerce/dev/backend