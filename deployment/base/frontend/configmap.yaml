apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-config
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: ecommerce
data:
  PORT: "3000"
  NODE_ENV: production
  # Server-side (SSR) requests reach the backend Service by its in-cluster
  # DNS name — not the public hostname.
  INTERNAL_API_URL: http://backend:4000
