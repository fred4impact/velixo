# Only used by the dev overlay — stage/prod use real S3 + IAM instead of MinIO.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: minio-secret
  labels:
    app.kubernetes.io/name: minio
    app.kubernetes.io/part-of: ecommerce
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: minio-secret
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: ecommerce/dev/minio
