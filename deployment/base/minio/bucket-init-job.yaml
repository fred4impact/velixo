# Creates the product-images bucket and sets it public-read, mirroring the
# minio-init service in the root docker-compose.yml. Runs after every ArgoCD
# sync where MinIO is healthy; safe to re-run (idempotent).
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-bucket-init
  labels:
    app.kubernetes.io/name: minio
    app.kubernetes.io/part-of: ecommerce
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: mc
          image: minio/mc:latest
          env:
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-secret
                  key: MINIO_ACCESS_KEY
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-secret
                  key: MINIO_SECRET_KEY
          command:
            - /bin/sh
            - -c
            - |
              set -e
              mc alias set local http://minio:9000 "$MINIO_ACCESS_KEY" "$MINIO_SECRET_KEY"
              mc mb -p local/product-images
              mc anonymous set download local/product-images
