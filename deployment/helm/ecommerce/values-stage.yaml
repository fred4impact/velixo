env: stage

backend:
  image:
    repository: ACCOUNT_ID.dkr.ecr.us-east-1.amazonaws.com/ecommerce-backend
    tag: stage # CI overwrites this tag as part of the deploy workflow
  hpa:
    enabled: true
  canarySteps:
    - setWeight: 20
    - pause: { duration: 2m }
    - setWeight: 50
    - pause: { duration: 2m }
    - setWeight: 100
  config:
    FRONTEND_URL: https://ecommerce-stage.example.com
    MINIO_ENDPOINT: s3.us-east-1.amazonaws.com
    MINIO_PORT: "443"
    MINIO_USE_SSL: "true"
    MINIO_BUCKET: ecommerce-stage-product-images
    MINIO_PUBLIC_URL: https://ecommerce-stage-product-images.s3.us-east-1.amazonaws.com
  externalSecret:
    secretsManagerKey: ecommerce/stage/backend

frontend:
  image:
    repository: ACCOUNT_ID.dkr.ecr.us-east-1.amazonaws.com/ecommerce-frontend
    tag: stage
  hpa:
    enabled: true
  canarySteps:
    - setWeight: 20
    - pause: { duration: 2m }
    - setWeight: 50
    - pause: { duration: 2m }
    - setWeight: 100
  config:
    INTERNAL_API_URL: http://backend:4000

devServices:
  enabled: false

externalSecrets:
  auth: irsa
  irsa:
    serviceAccountName: eso-irsa
    roleArn: "arn:aws:iam::ACCOUNT_ID:role/ecommerce-stage-eso"

ingress:
  frontendHost: ecommerce-stage.example.com
  backendHost: api.ecommerce-stage.example.com
  tls:
    enabled: true
    clusterIssuer: letsencrypt
    secretName: ecommerce-stage-tls
