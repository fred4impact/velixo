{{- if eq .Values.externalSecrets.auth "irsa" }}
# Dedicated identity for External Secrets Operator to assume via IRSA —
# separate from the app pods' own ServiceAccounts, which need no AWS
# permissions at all (ESO materializes the K8s Secret before pods start).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.externalSecrets.irsa.serviceAccountName }}
  labels:
    {{- include "ecommerce.labels" . | nindent 4 }}
  annotations:
    eks.amazonaws.com/role-arn: {{ .Values.externalSecrets.irsa.roleArn }}
---
{{- end }}
{{- if eq .Values.externalSecrets.auth "vault" }}
# Vault-backed SecretStore — dev-only alternative to AWS Secrets Manager
# (see deployment/platform/vault/). Auth is Vault's own Kubernetes auth
# method: ESO presents this namespace's ServiceAccount token, Vault
# verifies it against the role created in
# platform/vault/k8s-auth-role.yaml and returns a token scoped to
# platform/vault/dev-policy.hcl.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault-backend
  labels:
    {{- include "ecommerce.labels" . | nindent 4 }}
spec:
  provider:
    vault:
      server: {{ .Values.externalSecrets.vault.address }}
      path: internal
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: {{ .Values.externalSecrets.vault.role }}
          serviceAccountRef:
            name: {{ .Values.externalSecrets.vault.serviceAccountName }}
{{- else }}
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aws-secrets-manager
  labels:
    {{- include "ecommerce.labels" . | nindent 4 }}
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ .Values.externalSecrets.region }}
      auth:
        {{- if eq .Values.externalSecrets.auth "irsa" }}
        jwt:
          serviceAccountRef:
            name: {{ .Values.externalSecrets.irsa.serviceAccountName }}
        {{- else }}
        # kind has no OIDC federation with AWS, so ESO here authenticates
        # with a static IAM user's access key instead of IRSA. The
        # referenced Secret is created manually, out-of-band — see
        # docs/kind-local-guide.md. It is never committed to git.
        secretRef:
          accessKeyIDSecretRef:
            name: {{ .Values.externalSecrets.static.secretName }}
            key: access-key-id
          secretAccessKeySecretRef:
            name: {{ .Values.externalSecrets.static.secretName }}
            key: secret-access-key
        {{- end }}
{{- end }}
