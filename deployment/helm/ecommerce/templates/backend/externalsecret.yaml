# Syncs one JSON secret from AWS Secrets Manager into a K8s Secret named
# "backend-secret", whose keys become env vars via envFrom in rollout.yaml.
# Expected keys in the Secrets Manager secret: DATABASE_URL,
# JWT_ACCESS_SECRET, JWT_REFRESH_SECRET, STRIPE_SECRET_KEY,
# STRIPE_WEBHOOK_SECRET, MINIO_ACCESS_KEY, MINIO_SECRET_KEY (see docs/).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: backend-secret
  labels:
    {{- include "ecommerce.labels" . | nindent 4 }}
    app.kubernetes.io/name: backend
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ if eq .Values.externalSecrets.auth "vault" }}vault-backend{{ else }}aws-secrets-manager{{ end }}
    kind: SecretStore
  target:
    name: backend-secret
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: {{ .Values.backend.externalSecret.secretsManagerKey }}
