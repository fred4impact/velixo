# One NodePool + EC2NodeClass pair for the ecommerce workload, sized off
# this app's own per-replica numbers (backend ~1 CPU/2Gi, frontend ~0.5
# CPU/1Gi — see notes/devops-course-plan.md Part 4's capacity arithmetic),
# not a generic example. Applied with plain `kubectl apply`, not Helm — this
# is workload-specific config, distinct from the Karpenter controller
# install itself (values.yaml, same directory).
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: ecommerce
spec:
  template:
    metadata:
      labels:
        workload: ecommerce
    spec:
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        - key: karpenter.sh/capacity-type
          operator: In
          # stage tolerates spot (canary rollouts absorb pod churn
          # gracefully); prod does not — see values-prod.yaml equivalent
          # override applied via a second NodePool if/when prod adopts this.
          values: ["spot", "on-demand"]
        - key: node.kubernetes.io/instance-type
          operator: In
          values: ["t3.medium", "t3.large", "c5.large"]
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: ecommerce
      expireAfter: 720h # recycle nodes weekly-ish, bounds config/AMI drift
  limits:
    cpu: "32"
    memory: 64Gi
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 5m
---
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: ecommerce
spec:
  amiFamily: AL2023
  role: "ecommerce-karpenter-node" # instance profile role, created alongside the controller's IRSA role
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: ecommerce
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: ecommerce
  tags:
    workload: ecommerce
