# EKS only. Apply after cert-manager is installed:
#   kubectl apply -f cluster-issuer.yaml
# HTTP01 challenge via the ingress-nginx controller already installed —
# no DNS provider integration required. Replace the email.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: you@example.com
    privateKeySecretRef:
      name: letsencrypt-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: nginx
