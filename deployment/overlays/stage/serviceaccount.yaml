# Dedicated identity for External Secrets Operator to assume via IRSA —
# separate from the app pods' own ServiceAccounts, which need no AWS
# permissions at all (ESO materializes the K8s Secret before pods start).
# Replace ACCOUNT_ID with your real AWS account id.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-irsa
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/ecommerce-stage-eso
