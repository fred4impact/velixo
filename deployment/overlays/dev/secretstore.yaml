# kind has no OIDC federation with AWS, so ESO here authenticates with a
# static IAM user's access key instead of IRSA (unlike stage/prod).
# The referenced Secret ("aws-creds") is created manually, out-of-band —
# see docs/kind-local-guide.md. It is never committed to git.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        secretRef:
          accessKeyIDSecretRef:
            name: aws-creds
            key: access-key-id
          secretAccessKeySecretRef:
            name: aws-creds
            key: secret-access-key
