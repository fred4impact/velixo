apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ecommerce-dev

resources:
  - namespace.yaml
  - secretstore.yaml
  - ../../base
  - ../../base/mysql
  - ../../base/minio
  - ../../base/mailpit

# Built locally and loaded with `kind load docker-image` — no registry.
images:
  - name: ecommerce-backend
    newName: ecommerce-backend
    newTag: dev
  - name: ecommerce-frontend
    newName: ecommerce-frontend
    newTag: dev

patches:
  - path: replicas-patch.yaml
  - path: configmap-patch.yaml
  - target:
      kind: Ingress
      name: ecommerce
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: ecommerce.127.0.0.1.nip.io
      - op: replace
        path: /spec/rules/1/host
        value: api.ecommerce.127.0.0.1.nip.io
      - op: add
        path: /spec/rules/-
        value:
          host: minio.ecommerce.127.0.0.1.nip.io
          http:
            paths:
              - path: /
                pathType: Prefix
                backend:
                  service:
                    name: minio
                    port:
                      number: 9000
